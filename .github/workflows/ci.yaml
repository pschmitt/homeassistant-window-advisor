name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hassfest:
    name: Hassfest
    uses: pschmitt/ci-workflows/.github/workflows/home-assistant-hassfest.yaml@main
  ruff:
    name: Ruff
    uses: pschmitt/ci-workflows/.github/workflows/home-assistant-ruff.yaml@main
    with:
      uv-v5: true
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uvx --with jinja2 pytest tests/
